<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPKA Technician</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPKA Technician">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin:0; height:100%; background:#eef2fb; }
  body { padding-top:env(safe-area-inset-top); box-sizing:border-box; }
  iframe { display:block; width:100%; height:100%; border:0; background:#f4f6f5; }
  #slow { display:none; position:fixed; left:0; right:0; bottom:30px; text-align:center; font:15px Arial, sans-serif; }
  #slow a { background:#fff; color:#0e1d40; padding:10px 18px; border-radius:20px; text-decoration:none; box-shadow:0 2px 8px rgba(0,0,0,.2); }
</style>
</head>
<body>
<iframe id="app" allow="camera; geolocation" title="SPKA Technician"></iframe>
<div id="slow"><a id="open" href="#">Open app / Buka app</a></div>
<script>
  // Link to the Apps Script web app (Deploy > Manage deployments > Web app URL)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwdkIllAhkVvi5yqAZlzBGUTT6wECSXTshw6fKPRQecdh2T-sjeIN2FIYD3u5E_aS3QDA/exec';

  function get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function put(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }

  // The app sends its "remember me" key here after login, and an empty key on log out
  window.addEventListener('message', function (ev) {
    if (!/(^|\.)google(usercontent)?\.com$/.test(new URL(ev.origin).hostname)) return;
    if (ev.data && typeof ev.data === 'object' && 'spka_k' in ev.data) put('spka_k', ev.data.spka_k);
    if (ev.data && typeof ev.data === 'object' && ev.data.spka_theme) { put('spka_theme', ev.data.spka_theme); paint(ev.data.spka_theme); }
  });

  // Light / dark background behind the phone's status bar, matching the app
  function paint(t) {
    var c = t === 'dark' ? '#0a1124' : '#eef2fb';
    document.documentElement.style.background = c; document.body.style.background = c;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
  }
  var theme = get('spka_theme'); if (theme) paint(theme);

  var k = get('spka_k');
  var q = [];
  if (k) q.push('k=' + encodeURIComponent(k));
  if (theme) q.push('theme=' + theme);
  var url = APP_URL + (q.length ? '?' + q.join('&') : '');
  document.getElementById('app').src = url;
  document.getElementById('open').href = url;
  // If the app has not shown after 12 seconds, offer to open it directly
  var loaded = false;
  document.getElementById('app').onload = function () { loaded = true; document.getElementById('slow').style.display = 'none'; };
  setTimeout(function () { if (!loaded) document.getElementById('slow').style.display = 'block'; }, 12000);
</script>
</body>
</html>
